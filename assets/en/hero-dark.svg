<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Júlio Caliberda, curious enough to make things happen.">
  <title>Júlio Caliberda</title>
  <style>
    .n { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 58px; font-weight: 700; fill: #EAF7F8; letter-spacing: -.5px; }
    .t { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 21px; fill: #8FB3BA; }
    .k { font-family: 'Cascadia Mono','JetBrains Mono',Consolas,'SF Mono','Roboto Mono',monospace; font-size: 12px; fill: #8FB3BA; letter-spacing: 2.6px; }
  </style>

  <path d="M60 74 H214 L137 222 Z" fill="none" stroke="#2B4C54" stroke-width="1.6"/>
  <path d="M60 74 H214 L137 222 Z" fill="none" stroke="#3FD0C9" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="46 442">
    <animate attributeName="stroke-dashoffset" values="0;-488" keyTimes="0;1" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="137" cy="222" r="3" fill="#F08E71"/>

  <text x="290" y="132" class="n">Júlio Caliberda</text>

  <path d="M290 152 H944" stroke="#3FD0C9" stroke-width="1.4" stroke-dasharray="654" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="654;0" keyTimes="0;1" dur="1.1s"
             calcMode="spline" keySplines="0.22 0.61 0.36 1" fill="freeze"/>
  </path>

  <g clip-path="url(#cut)">
    <text x="290" y="190" class="t" textLength="396" lengthAdjust="spacingAndGlyphs">curious enough to make things happen</text>
  </g>
  <clipPath id="cut">
    <rect x="290" y="168" width="400" height="30">
      <animate attributeName="width" values="0;400" keyTimes="0;1" dur="1.7s" begin=".8s"
               calcMode="spline" keySplines="0.3 0.7 0.4 1" fill="freeze"/>
    </rect>
  </clipPath>
  <rect x="690" y="171" width="2" height="24" fill="#F08E71">
    <animate attributeName="x" values="290;690" keyTimes="0;1" dur="1.7s" begin=".8s"
             calcMode="spline" keySplines="0.3 0.7 0.4 1" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.46;.99;1"
             begin="2.5s" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="290" y="232" class="k">AI PROMPTER · SYSTEMS ANALYST · BITZSOFTWARES</text>
</svg>
