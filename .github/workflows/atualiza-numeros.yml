name: atualiza os números

on:
  schedule:
    # todo dia às 06:10 UTC (03:10 em Brasília)
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar heatmap e números
        env:
          # GH_PAT é opcional. Sem ele, as contribuições em repositório
          # privado não aparecem. Veja o README do diretório scripts/.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/atualiza_numeros.py

      - name: Publicar se algo mudou
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "números do dia"
            git push
          else
            echo "nada mudou hoje"
          fi
